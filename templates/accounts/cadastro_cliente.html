<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Renk Gás</title>
    <!-- Tailwind CSS CDN para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho / Hero -->
    <header class="bg-gray-800 border-b border-gray-700 py-4 text-center">
        <h1 class="text-2xl font-bold text-purple-500">Renk Gás</h1>
        <p class="text-sm text-gray-400">Atendimento em Jardim Campos, Jardim Nazaré, Jardim Robru e Vila Lourdes</p>
    </header>

    <!-- Formulário de Cadastro -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md border border-gray-700">
            <h2 class="text-xl font-bold text-white mb-6 text-center">Cadastro de Cliente</h2>
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {% for field in form %}
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
                
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded transition duration-200">
                    Criar Minha Conta
                </button>
            </form>
        </div>
    </main>

    <!-- Rodapé de Divulgação -->
    <footer class="bg-gray-800 border-t border-gray-700 py-3 text-center text-xs text-gray-400">
        Desenvolvido por Brito's Code Tecnologia | (11) 97264-6617
    </footer>

</body>
</html>
