<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Renk Gás{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">
    <nav class="bg-blue-600 text-white shadow-md mb-6">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-xl font-bold tracking-wide">Renk Gás</a>
            <div class="space-x-4">
                {% if user.is_authenticated %}
                    <a href="{% url 'deliveries:meus_pedidos' %}" class="hover:underline">Meus Pedidos</a>
                    <a href="{% url 'deliveries:criar_pedido' %}" class="hover:underline">Novo Pedido</a>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="hover:underline">Entrar</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
